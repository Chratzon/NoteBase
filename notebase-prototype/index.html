<!doctype html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>NoteBase</title>
<meta name="description" content="NoteBase &mdash; Notenblatt-Editor mit Klaviatur-Eingabe, echtem Notensatz und Instrumenten-Sounds.">

<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#0D0E12">
<meta name="color-scheme" content="dark">

<!-- iOS "Zum Home-Bildschirm" -->
<link rel="apple-touch-icon" href="icons/icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="NoteBase">

<link rel="icon" href="icons/icon-192.png">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap">
<link rel="stylesheet" href="styles.css">
</head>
<body>

<div class="device" id="device">

  <!-- HEADER -->
  <div class="app-header" id="appHeader"></div>

  <!-- DRAWER -->
  <div class="scrim" id="scrim"></div>
  <div class="drawer" id="drawer">
    <div class="drawer-brand">
      <div class="dot"></div>
      <div>
        <div class="name">NoteBase</div>
        <div class="tag">Notenblatt &amp; Setlist Studio</div>
      </div>
    </div>
    <div class="divider"></div>
    <div id="drawerNav"></div>
    <div class="divider"></div>
    <div class="drawer-section-label">Schnell-Werkzeuge</div>
    <div id="drawerQuick"></div>
    <div class="drawer-footer">
      <span style="color:var(--amber)">&#9432;</span>
      <span>NoteBase v2.0 &middot; Bereit f&uuml;r Live-Auftritte &amp; Proben</span>
    </div>
  </div>

  <!-- CONTENT -->
  <div class="content" id="content">
    <div class="views-scroll" id="viewsScroll">
      <div class="view" id="view-BIBLIOTHEK"></div>
      <div class="view" id="view-SETLISTEN"></div>
      <div class="view" id="view-EDITOR"></div>
    </div>
    <div class="editor-dock" id="editorDock"></div>
  </div>

  <!-- MODAL -->
  <div class="modal-scrim" id="modalScrim"><div class="modal" id="modalBody"></div></div>

  <div class="update-banner" id="updateBanner">
    <span>Neue Version verf&uuml;gbar</span>
    <button id="updateReloadBtn">Aktualisieren</button>
    <button id="updateDismissBtn" title="Sp&auml;ter">&times;</button>
  </div>

  <div class="toast" id="toast"></div>
</div>

<script src="app.js"></script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load", ()=>{
    navigator.serviceWorker.register("service-worker.js").then((reg)=>{
      // A worker is already waiting from a previous visit (e.g. this load itself got the new HTML,
      // but an updated SW had already finished installing in the background before now).
      if(reg.waiting) window.dispatchEvent(new CustomEvent("notebase:update-ready"));

      reg.addEventListener("updatefound", ()=>{
        const installing = reg.installing;
        if(!installing) return;
        installing.addEventListener("statechange", ()=>{
          if(installing.state==="installed" && navigator.serviceWorker.controller){
            window.dispatchEvent(new CustomEvent("notebase:update-ready"));
          }
        });
      });

      // Re-check for a new version every time the app is brought back to the foreground —
      // this is the "active trigger" a standalone installed app needs, since it has no reload button.
      document.addEventListener("visibilitychange", ()=>{
        if(document.visibilityState==="visible") reg.update().catch(()=>{});
      });
    }).catch(()=>{});
  });
}
</script>
</body>
</html>
